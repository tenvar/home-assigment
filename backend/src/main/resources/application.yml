spring:
  application:
    name: wallet
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wallet}
    username: ${DB_USER:wallet}
    password: ${DB_PASSWORD:wallet}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
server:
  shutdown: graceful
